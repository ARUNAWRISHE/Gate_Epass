services:
  - type: web
    name: gate-epass-backend
    env: python
    pythonVersion: 3.10
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
      - key: FLASK_ENV
        value: production
      - key: DEBUG
        value: "False"
